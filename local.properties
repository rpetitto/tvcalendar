# Copy this file to local.properties and fill in your own values.
# local.properties is git-ignored and must never be committed.

# Android SDK location (Android Studio sets this automatically).
# sdk.dir=/path/to/Android/sdk

# OAuth client created in Google Cloud Console for
# "TV and Limited Input devices".
GOOGLE_CLIENT_ID=your_client_id_here.apps.googleusercontent.com
GOOGLE_CLIENT_SECRET=your_client_secret_here
